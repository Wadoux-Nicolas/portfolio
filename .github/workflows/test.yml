name: "Test"
on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - branch: develop
            artifact: develop
          - branch: ${{ github.head_ref }}
            artifact: pull-request

    permissions:
      # Required to checkout the code
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.branch }}
          ## Set repository to correctly checkout from forks
          repository: ${{ github.event.pull_request.head.repo.full_name }}
      - name: "Install Node"
        uses: actions/setup-node@v5
        with:
          node-version: "24.9.0"
      - name: "Install Deps"
        run: npm install
      - name: "Test"
        run: npx vitest --coverage.enabled true
      - name: "Upload Coverage"
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.artifact }}
          path: coverage

  report-coverage:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      ## Check out the repository to obtain the vitest.config file
      - uses: actions/checkout@v5
      - name: "Download Coverage Artifacts"
        uses: actions/download-artifact@v5
        with:
          name: coverage-pull-request
          path: coverage
      - uses: actions/download-artifact@v5
        with:
          name: coverage-develop
          path: coverage-develop
      - name: "Report Coverage"
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          json-summary-compare-path: coverage-develop/coverage-summary.json
